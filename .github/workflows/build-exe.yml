name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors pandas scikit-learn beautifulsoup4 requests numpy==1.26.4 pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --add-data "model;model" --add-data "templates;templates" --add-data "static;static" app.py

    - name: Upload Windows Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhishGuard-Server-Windows
        path: dist/app.exe
